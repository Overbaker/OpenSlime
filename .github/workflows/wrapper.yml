name: Wrapper

# Only when the Go wrapper changes; OpenSlime ships it unmodified from upstream.
# TestBackendRunCoverage is intermittent on GitHub runners (upstream code); rerun before debugging.
on:
  push:
    branches: [main]
    paths: ['codeagent-wrapper/**']
  pull_request:
    paths: ['codeagent-wrapper/**']
  workflow_dispatch:

jobs:
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: codeagent-wrapper
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - run: go build -o /dev/null .
      - run: go test -short ./...
